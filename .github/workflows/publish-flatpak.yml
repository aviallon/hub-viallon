name: Publish Flatpak repository

# Reusable workflow. Merges a freshly-built OSTree repository (produced by the
# caller's flatpak-builder job and handed over as an artifact) into the
# ACCUMULATED repository served from this repository's Pages branch.
#
# Why an accumulated repo: OSTree is incremental, so each build's objects must be
# merged into the existing repository - never rebuilt from scratch - or clients
# lose delta updates and re-download every tree.
#
# Callers live in other repositories (see `on.workflow_call`). A called
# workflow's jobs run inside the CALLER's run, so `actions/download-artifact`
# sees the caller's artifacts. The caller's GITHUB_TOKEN only has write access to
# the caller's repository, which is why pushing here needs `hub-token`.

on:
  workflow_call:
    inputs:
      app-id:
        description: Flatpak application ID.
        required: true
        type: string
      ostree-branch:
        description: OSTree branch this build publishes (stable or beta).
        required: true
        type: string
      artifact:
        description: Name of the artifact holding the exported OSTree repo.
        required: true
        type: string
      pages-dir:
        description: Directory under the Pages root holding this app's repository.
        required: true
        type: string
      pages-branch:
        description: Git branch GitHub Pages serves.
        required: false
        type: string
        default: gh-pages
      subject:
        description: Commit subject (normally the version) shown by `ostree log`.
        required: false
        type: string
        default: ""
      title:
        description: Human title for the .flatpakrepo file.
        required: false
        type: string
        default: Flatpak repository
      homepage:
        description: Homepage URL recorded in the enrolment files.
        required: false
        type: string
        default: ""
      image:
        description: Container image providing flatpak + ostree.
        required: false
        type: string
        default: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      dry-run:
        description: Publish to "<pages-branch>-dryrun" instead of the live branch.
        required: false
        type: boolean
        default: false
    secrets:
      hub-token:
        description: Token with contents:write on this repository (PAT or deploy key).
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.app-id }} (${{ inputs.ostree-branch }})
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    env:
      APP_ID: ${{ inputs.app-id }}
      OSTREE_BRANCH: ${{ inputs.ostree-branch }}
      PAGES_DIR: ${{ inputs.pages-dir }}
      TARGET_BRANCH: ${{ inputs.dry-run && format('{0}-dryrun', inputs.pages-branch) || inputs.pages-branch }}
    steps:
      - name: Download the built repository
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: newrepo

      - name: Check out the Pages branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_BRANCH }}
          path: site
          token: ${{ secrets.hub-token }}
          fetch-depth: 1
        continue-on-error: true

      - name: Ensure the OSTree skeleton
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "site/${PAGES_DIR}/repo"
          if [ ! -d site/.git ]; then
            ( cd site && git init -q -b "$TARGET_BRANCH" )
          fi
          cd "site/${PAGES_DIR}/repo"
          # First publish: an archive-z2 repo is the format served over HTTPS.
          [ -d objects ] || ostree --repo=. init --mode=archive-z2
          # git does not store empty directories, so a fresh checkout loses the
          # empty parts of the OSTree layout. Without recreating them, ostree
          # fails with "opendir(refs/remotes): No such file or directory" on the
          # SECOND publish. mkdir -p is idempotent.
          mkdir -p objects refs/heads refs/mirrors refs/remotes \
                   state extensions tmp/cache

      - name: Merge this build into the accumulated repo
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          REF="app/${APP_ID}/x86_64/${OSTREE_BRANCH}"
          SUBJECT='${{ inputs.subject }}'
          [ -n "$SUBJECT" ] || SUBJECT="$OSTREE_BRANCH"
          # A stable publish lands on BOTH channels: the beta branch's contract
          # is "the newest release, beta or stable", so beta-tracking installs
          # see stables as ordinary updates instead of being stranded on the last
          # beta. A beta publish touches only beta.
          TARGETS="$OSTREE_BRANCH"
          [ "$OSTREE_BRANCH" = "stable" ] && TARGETS="stable beta"
          for BR in $TARGETS; do
            flatpak build-commit-from \
              --src-repo=newrepo \
              --src-ref="$REF" \
              --subject="$SUBJECT" \
              "site/${PAGES_DIR}/repo" "app/${APP_ID}/x86_64/${BR}"
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Regenerate summary and static deltas
        shell: bash
        run: |
          set -euo pipefail
          flatpak build-update-repo \
            --generate-static-deltas \
            --default-branch=stable \
            --prune --prune-depth=20 \
            "site/${PAGES_DIR}/repo"

      - name: Write the enrolment files
        shell: bash
        env:
          PAGES_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          HOMEPAGE: ${{ inputs.homepage }}
        run: |
          set -euo pipefail
          REPO_DIR="site/${PAGES_DIR}/repo"
          BASE="site/${PAGES_DIR}"
          URL="${PAGES_URL}/${PAGES_DIR}/repo/"
          # Unsigned repository: NoGpgVerify tells flatpak not to expect
          # signatures. Verified to work with `flatpak remote-add --from`.
          cat > "${BASE}/$(basename "${PAGES_DIR}").flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=${{ inputs.title }}
          Url=${URL}
          DefaultBranch=stable
          Homepage=${HOMEPAGE}
          NoGpgVerify=true
          EOF
          # One-command install files, written only for branches that actually
          # exist - a .flatpakref pointing at a missing branch errors at install
          # time. Skip the stable file when it would just duplicate the repo file.
          for BR in stable beta; do
            if ostree --repo="$REPO_DIR" refs | grep -qx "app/${APP_ID}/x86_64/${BR}"; then
              SUFFIX=""; [ "$BR" = "beta" ] && SUFFIX="-beta"
              cat > "${BASE}/$(basename "${PAGES_DIR}")${SUFFIX}.flatpakref" <<EOF
          [Flatpak Ref]
          Name=${APP_ID}
          Branch=${BR}
          Title=${{ inputs.title }} (${BR})
          Url=${URL}
          SuggestRemoteName=amethyst-aviallon
          Homepage=${HOMEPAGE}
          IsRuntime=false
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          NoGpgVerify=true
          EOF
            fi
          done
          # Keep GitHub Pages from running Jekyll over the OSTree object dirs.
          touch site/.nojekyll
          ls -1 "$BASE"

      # Fail loudly here rather than serving a broken remote: if OSTree cannot
      # read back what we just wrote, the publish is broken regardless of what
      # Pages later serves.
      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="site/${PAGES_DIR}/repo"
          ostree --repo="$REPO_DIR" summary --view | head -40
          for BR in ${{ steps.merge.outputs.targets }}; do
            REF="app/${APP_ID}/x86_64/${BR}"
            ostree --repo="$REPO_DIR" refs | grep -Fx "$REF"
            echo "ref $REF present"
          done
          ostree --repo="$REPO_DIR" fsck --quiet
          echo "OSTree repo OK - all published refs present, fsck clean."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish - repository already up to date."
            exit 0
          fi
          git commit -q -m "${{ inputs.subject != '' && inputs.subject || inputs.ostree-branch }}"
          git push -f origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "pushed $(git rev-parse --short HEAD) to ${TARGET_BRANCH}"
